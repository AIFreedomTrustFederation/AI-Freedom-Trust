name: Doctrine Integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: doctrine-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate federation manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          manifest_path = root / "manifests/federation.manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert manifest["kind"] == "federation-manifest"
          assert manifest["trustSeedPattern"]["localFirst"] is True
          assert manifest["trustSeedPattern"]["federationOptional"] is True
          assert manifest["trustSeedPattern"]["privacyDefault"] == "local-private"

          declared = {
              **manifest["canonicalDocuments"],
              "trustSeedPattern": manifest["trustSeedPattern"]["templatePath"],
          }
          for label, raw_path in declared.items():
              path = PurePosixPath(raw_path)
              assert not path.is_absolute() and ".." not in path.parts, (
                  f"{label} escapes the repository: {raw_path}"
              )
              target = root.joinpath(*path.parts)
              assert target.exists(), f"{label} is missing: {raw_path}"

          print(f"Validated {len(declared)} declared doctrine paths")
          PY

      - name: Compile research scripts
        env:
          PYTHONPYCACHEPREFIX: /tmp/aift-python-cache
        run: python -m compileall -q research/aethercore-test-001/scripts

      - name: Confirm validation leaves checkout clean
        run: git diff --exit-code
