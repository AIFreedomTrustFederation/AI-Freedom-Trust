name: Doctrine Integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: doctrine-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Run doctrine validation
        run: python scripts/validate_doctrine.py

      - name: Confirm validation leaves checkout clean
        run: git diff --exit-code
